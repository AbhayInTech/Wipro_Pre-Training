<div class="container mt-4">
  <h2 class="text-center text-primary mb-4">
    <i class="bi bi-people"></i> Manage Users - Questions
  </h2>

  <div *ngIf="questions.length === 0" class="alert alert-info">Loading questions...</div>

  <div *ngIf="questions.length > 0" class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Title</th>
          <th>Question</th>
          <th>Asked By</th>
          <!-- <th>Answers</th> -->
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let question of questions">
          <td>{{ question.title }}</td>
          <td>{{ question.text }}</td>
          <td>{{ question.askedBy?.username || 'Unknown' }}</td>
          <!-- <td>
            <div *ngIf="question.answers && question.answers.length > 0">
              <ul class="list-group list-group-flush">
                <li *ngFor="let answer of question.answers" class="list-group-item">
                  <strong>{{ answer.text }}</strong> - Answered by
                  {{ answer.answeredBy?.username || 'Unknown' }}
                </li>
              </ul>
            </div>
            <div *ngIf="!question.answers || question.answers.length === 0">
              <span class="text-muted">No answers yet</span>
            </div>
          </td> -->
          <td>
            <span
              class="badge"
              [ngClass]="{
                'bg-success': question.status === 'Approved',
                'bg-warning': question.status === 'Pending',
                'bg-danger': question.status === 'Rejected'
              }"
              >{{ question.status }}</span
            >
          </td>
          <td>
            <button
              class="btn btn-danger btn-sm"
              (click)="deleteQuestion(question.questionId)"
              title="Delete Question"
            >
              <i class="bi bi-trash"></i> Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
