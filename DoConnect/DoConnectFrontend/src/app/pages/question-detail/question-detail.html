<div class="container mt-4">
  <!-- Question Card -->
  <div class="card shadow-sm mb-4">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">{{ q?.title }}</h4>
    </div>
    <div class="card-body">
      <p class="card-text">{{ q?.text }}</p>
      <p class="text-muted mb-0">
        <i class="bi bi-person-circle"></i> Posted by: {{ q?.user?.username || 'Anonymous' }}
      </p>
      <span class="badge bg-info mt-2">Status: {{ q?.status }}</span>
    </div>
  </div>

  <!-- Answers Section -->
  <div class="mb-4">
    <h5 class="text-success"><i class="bi bi-chat-dots"></i> Answers</h5>
    <div *ngIf="answers.length === 0" class="alert alert-secondary">
      No answers yet. Be the first to answer!
    </div>

    <div *ngFor="let a of answers" class="card mb-3 shadow-sm">
      <div class="card-body">
        <p class="mb-1">{{ a.text }}</p>
        <small class="text-muted">
          <i class="bi bi-person"></i> {{ a.user }} |
          <span class="badge bg-light text-dark">{{ a.status }}</span>
        </small>
      </div>
    </div>
  </div>

  <!-- Add Answer Form -->
  <div class="card shadow-sm">
    <div class="card-header bg-light">
      <h5 class="mb-0"><i class="bi bi-pencil-square"></i> Add Your Answer</h5>
    </div>
    <div class="card-body">
      <div *ngIf="msg" class="alert alert-info">{{ msg }}</div>
      <form (ngSubmit)="submit()">
        <div class="mb-3">
          <textarea
            [(ngModel)]="text"
            name="answer"
            rows="3"
            class="form-control"
            placeholder="Write your answer here..."
          ></textarea>
        </div>
        <button type="submit" class="btn btn-success">
          <i class="bi bi-send"></i> Submit Answer
        </button>
      </form>
    </div>
  </div>
</div>
