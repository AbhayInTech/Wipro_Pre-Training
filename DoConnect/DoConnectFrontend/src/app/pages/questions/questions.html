<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="text-primary">Questions</h2>
    <a *ngIf="role" routerLink="/ask" class="btn btn-success">
      <i class="bi bi-plus-circle"></i> Ask Question
    </a>
  </div>

  <!-- Search -->
  <div class="input-group mb-4">
    <input [(ngModel)]="q" type="text" class="form-control" placeholder="Search questions..." />
    <button class="btn btn-outline-primary" (click)="search()">
      <i class="bi bi-search"></i> Search
    </button>
  </div>

  <!-- Questions list -->
  <div class="list-group shadow-sm">
    <a
      *ngFor="let item of list"
      [routerLink]="['/q', item.questionId]"
      class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
    >
      <div>
        <h5 class="mb-1">{{ item.title }}</h5>
        <small class="text-muted">Status: {{ item.status }}</small>
      </div>
      <i class="bi bi-arrow-right-circle text-primary fs-4"></i>
    </a>
  </div>
</div>
