<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
          <h3>Register</h3>
        </div>
        <div class="card-body">
          <div *ngIf="msg" class="alert alert-danger">{{ msg }}</div>

          <form (ngSubmit)="submit()">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input [(ngModel)]="username" name="username" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input [(ngModel)]="password" name="password" type="password" class="form-control" />
            </div>
            <div class="mb-3">
              <label class="form-label">Role</label>
              <select [(ngModel)]="role" name="role" class="form-select">
                <option>User</option>
                <option>Admin</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
          </form>
        </div>
        <div class="card-footer text-center">
          <small>Already have an account? <a routerLink="/login">Login here</a></small>
        </div>
      </div>
    </div>
  </div>
</div>
