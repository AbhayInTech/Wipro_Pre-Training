<div style="padding: 20px; font-family: Arial, sans-serif">
  <h1>Simple Axios Demo</h1>

  <button (click)="getData()" style="padding: 10px; margin: 10px">
    {{ loading ? 'Loading...' : 'Get Random User' }}
  </button>

  <div *ngIf="user">
    <h3>User Info:</h3>

    <img [src]="user.picture.large" alt="User" style="border-radius: 50%" />

    <p><strong>Name:</strong> {{ user.name.first }} {{ user.name.last }}</p>

    <p><strong>Email:</strong> {{ user.email }}</p>

    <p><strong>Location:</strong> {{ user.location.city }}, {{ user.location.country }}</p>
  </div>

  <div *ngIf="error" style="color: red; margin-top: 20px">Error: {{ error }}</div>
</div>

// Helper method to make API calls

  private async makeApiCall(url: string, description: string) {

    this.loading = true;

    this.error = '';

    this.data = null;

 

    try {

      const response = await axios.get(url);

      this.data = response.data;

      console.log(`${description} successful:`, response.data);

    } catch (err: any) {

      this.error = err.response?.data?.message || err.message || `Failed to ${description}`;

      console.error(`${description} error:`, err);

      

      // If token is invalid, force logout

      if (err.response?.status === 401) {

        this.logout();

        this.error += ' - Session expired, please login again';

      }

    } finally {

      this.loading = false;

    }

  }

Automatically attaches JWT on every request.

If token expired → calls /auth/refresh, saves new token, retries original request.

If refresh also fails → logs out user, navigates to login.


Component calls API through AxiosService.

Axios attaches access token to request.

If token is valid → API responds 200 OK.

If token is expired → API responds 401 Unauthorized.

Axios interceptor catches 401 and automatically calls /auth/refresh.

If refresh is valid → new access token is saved and original request is retried.

If refresh fails → tokens are cleared, and user is redirected to login page.
